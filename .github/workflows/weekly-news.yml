name: Weekly Tech News Digest

on:
  schedule:
    # GeekNews Weekly 는 매주 월요일 아침 발행 → 월요일 오후 KST 실행
    # KST 월요일 14:00 = UTC 월요일 05:00
    - cron: '0 5 * * MON'
  workflow_dispatch:
    inputs:
      weekly_id:
        type: string
        description: 'weekly 이슈 id 수동 지정 (예: 202631, 선택)'
        required: false
        default: ''
      max_items:
        type: string
        description: '요약할 최대 뉴스 수 (기본 35)'
        required: false
        default: ''
      force:
        type: boolean
        description: '이미 발행됐어도 재발행'
        required: false
        default: false
      dry_run:
        type: boolean
        description: 'Dry-run (발행 없이 마크다운만 출력)'
        required: false
        default: false

env:
  PYTHON_VERSION: '3.11'
  TZ: 'Asia/Seoul'

jobs:
  generate-weekly-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests jinja2 pyyaml

      - name: Run weekly news digest
        id: digest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          BLOG_REPO: joyuno/joyuno.github.io
          BLOG_BRANCH: main
          MAX_ITEMS: ${{ github.event.inputs.max_items }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.weekly_id }}" ]; then
            ARGS="$ARGS --weekly-id ${{ github.event.inputs.weekly_id }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python src/main_weekly_news.py $ARGS

      - name: Summary
        if: always()
        run: |
          echo "## 📰 Weekly Tech News Digest 실행 결과" >> $GITHUB_STEP_SUMMARY
          echo "- **시간**: $(date '+%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY
          echo "- **상태**: ${{ steps.digest.outcome }}" >> $GITHUB_STEP_SUMMARY
